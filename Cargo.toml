[package]
name = "krusty"
version = "0.0.3"
edition = "2024"
license = "GPL-2.0-only"
description = "A native Kubernetes desktop client built with GPUI Kit"

[dependencies]
dirs = "7.0.0"
futures = "0.3.34"
gpui-kit = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "0.2.38"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", features = ["rustls-tls", "ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vt100 = "0.18.1"
